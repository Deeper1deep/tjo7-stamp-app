name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Apply icons
        run: python3 scripts/apply_android.py
      - name: Verify native save plugin is in the project
        run: grep -q SaveToDevicePlugin android/app/src/main/java/com/tjo7/stamp/MainActivity.java && echo 'native save plugin OK'
      - name: Verify the share target is in the manifest
        run: grep -q "android.intent.action.SEND" android/app/src/main/AndroidManifest.xml && grep -q ShareReceiverPlugin android/app/src/main/java/com/tjo7/stamp/MainActivity.java && echo 'share target OK'
      - name: Verify fixed signing key is wired in
        run: grep -q "signingConfigs.tjo7" android/app/build.gradle && grep -q GITHUB_RUN_NUMBER android/app/build.gradle && echo 'signing OK'
      - name: Verify the in-app updater is wired in
        run: grep -q UpdatePlugin android/app/src/main/java/com/tjo7/stamp/MainActivity.java && grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml && grep -q "androidx.core.content.FileProvider" android/app/src/main/AndroidManifest.xml && grep -q cache-path android/app/src/main/res/xml/file_paths.xml && echo 'updater OK'

      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA256' | head -1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tjo7-stamp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Publish a release with a direct download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tjo7-stamp.apk
          gh release create "build-${{ github.run_number }}" tjo7-stamp.apk \
            --title "ختم t.jo7 - بناء ${{ github.run_number }}" \
            --notes "نزّل tjo7-stamp.apk وثبّته فوق النسخة القديمة." \
            --latest
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y || true

      - name: Publish to the public releases repo (read by the in-app updater)
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN secret is missing - skipping the public release"; exit 0; fi
          export GH_TOKEN="$RELEASES_TOKEN"
          TAG="build-${{ github.run_number }}"
          SIZE=$(stat -c%s tjo7-stamp.apk)
          python3 scripts/make_latest.py "${{ github.run_number }}" "$SIZE" "$TAG" > latest.json
          cat latest.json
          gh release create "$TAG" tjo7-stamp.apk latest.json -R Deeper1deep/tjo7-stamp-releases \
            --title "ختم t.jo7 - بناء ${{ github.run_number }}" \
            --notes-file release-notes.txt --latest
          gh release list -R Deeper1deep/tjo7-stamp-releases --limit 100 --json tagName --jq '.[5:][].tagName' | xargs -r -I{} gh release delete {} -R Deeper1deep/tjo7-stamp-releases --cleanup-tag -y || true
