name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the signed APK to the public releases repo (read by the in-app updater)"
        type: boolean
        default: false
  push:
    branches: [main, master, migration/kotlin-native-offline]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace
      - name: Build debug + release APKs (signed with the original key)
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package, version and signing certificate
        env:
          KSP: ${{ github.run_id }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          echo "== badging"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" | sed -E "s/ platformBuildVersion.*//"
          "$BT/aapt2" dump badging "$APK" | grep -q "name='com.tjo7.stamp'" 
          echo "== apksigner verify"
          "$BT/apksigner" verify --verbose "$APK" | head -4
          APK_FP=$("$BT/apksigner" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          # Fingerprint of the committed original keystore (password is read from the committed config, never printed)
          export KS_PASS=$(grep '^storePassword=' signing/tjo7.properties | cut -d= -f2-)
          echo "::add-mask::$KS_PASS"
          KS_FP=$(keytool -list -v -keystore signing/tjo7.keystore -alias tjo7 -storepass:env KS_PASS | grep "SHA256:" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK  signer SHA-256: $APK_FP"
          echo "KEYSTORE   SHA-256: $KS_FP"
          test "$APK_FP" = "$KS_FP"
          echo "signing certificate matches the original keystore"
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/tjo7-stamp.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/tjo7-stamp-debug.apk
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r=ET.parse(p).getroot(); t+=int(r.get("tests"));f+=int(r.get("failures"));e+=int(r.get("errors"));s+=int(r.get("skipped"))
          print(f"UNIT TESTS: total={t} failures={f} errors={e} skipped={s}")
          PY
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # the Actions artifact quota can be full; the release step is what matters
        with:
          name: apk-and-reports
          path: |
            dist/*.apk
            app/build/reports/**
            app/build/test-results/**
          retention-days: 3
      - name: Keep APK for later jobs
        uses: actions/cache/save@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Instrumented tests + install-over-the-old-app test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/emulator_checks.sh
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/**
          retention-days: 3

  publish:
    needs: [build, instrumented]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: dist
          key: dist-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Publish a release in this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/tjo7-stamp.apk \
            --title "ختم t.jo7 - بناء ${{ github.run_number }}" \
            --notes-file release-notes.txt --latest
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | xargs -r -I{} gh release delete {} --cleanup-tag -y || true
      - name: Publish to the public releases repo (read by the in-app updater)
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then echo "RELEASES_TOKEN secret is missing"; exit 1; fi
          export GH_TOKEN="$RELEASES_TOKEN"
          TAG="build-${{ github.run_number }}"
          SIZE=$(stat -c%s dist/tjo7-stamp.apk)
          python3 scripts/make_latest.py "${{ github.run_number }}" "$SIZE" "$TAG" dist/tjo7-stamp.apk > dist/latest.json
          cat dist/latest.json
          gh release create "$TAG" dist/tjo7-stamp.apk dist/latest.json -R Deeper1deep/tjo7-stamp-releases \
            --title "ختم t.jo7 - بناء ${{ github.run_number }}" \
            --notes-file release-notes.txt --latest
          gh release list -R Deeper1deep/tjo7-stamp-releases --limit 100 --json tagName --jq '.[5:][].tagName' | xargs -r -I{} gh release delete {} -R Deeper1deep/tjo7-stamp-releases --cleanup-tag -y || true
      - name: Verify the public update feed
        run: |
          sleep 5
          curl -fsSL https://github.com/Deeper1deep/tjo7-stamp-releases/releases/latest/download/latest.json | tee /tmp/l.json
          python3 -c "import json;d=json.load(open('/tmp/l.json'));assert d['versionCode']==${{ github.run_number }};print('feed OK', d['versionCode'])"
