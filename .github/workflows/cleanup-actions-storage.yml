name: Clean Actions artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            echo "Deleting artifact $artifact_id"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
          done
      - run: echo "Artifact cleanup completed for ${GITHUB_REPOSITORY}."